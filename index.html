<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Chairman</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>

<div id="menu">
  <h1>Flappy Chairman</h1>
  <label>Select Character</label>
  <select id="character">
    <option value="flappybird.png">Flappy Bird</option>
    <option value="Mao.png">🇨🇳 Chairman Mao</option>
    <option value="Jinping.png">🇨🇳 Xi Jinping</option>
    <option value="Trump.png">🇺🇸 Donald Trump</option>
  </select>

  <div id="charPreviewBox">
    <img id="charPreview" src="assets/characters/flappybird.png" alt="Character Preview">
  </div>

  <label>Select Difficulty</label>
  <select id="difficulty">
    <option value="normal">Normal</option>
    <option value="hard">Hard</option>
    <option value="extreme">Extreme</option>
    <option value="impossible">Literally Impossible</option>
  </select><br>
  <button onclick="startGame()">Play</button>
</div>

<div id="hitboxText">Want a challenge? Press F to hide Hitboxes!</div>
<button id="playAgainBtn">Play Again</button>
<canvas id="gameCanvas"></canvas>

<script src="src/index.js"></script>
</body>
</html>
